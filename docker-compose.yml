services:
  postgres:
    image: postgres:16
    container_name: nextindie_db
    environment:
      POSTGRES_DB: nextindie_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass123
    command: postgres -c listen_addresses='*'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: