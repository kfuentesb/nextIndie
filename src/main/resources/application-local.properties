spring.config.import=optional:file:.env[.properties]

spring.application.name=NextIndie

# Local PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nextindie_db}}
spring.datasource.username=${DB_USER:${POSTGRES_USER:admin}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:pass123}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Server
server.port=${PORT:8080}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# IGDB
igdb.api.base-url=https://api.igdb.com/v4
igdb.api.token-url=https://id.twitch.tv/oauth2/token
igdb.api.client-id=${IGDB_CLIENT_ID}
igdb.api.client-secret=${IGDB_CLIENT_SECRET}